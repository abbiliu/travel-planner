// ── GAS API ────────────────────────────────────────────────────────
async function gasCall(method, params) {
  const url = getGasUrl();
  if (!url) throw new Error('請先在設定中填入 Apps Script URL');
  let res;
  if (method === 'GET') {
    res = await fetch(url + '?' + new URLSearchParams(params).toString());
  } else {
    res = await fetch(url, { method: 'POST', body: JSON.stringify(params) });
  }
  const data = await res.json();
  if (!data.success) throw new Error(data.error?.message || '伺服器錯誤');
  return data.data;
}
async function fetchNotes(tripId) {
  const tok = currentShareToken();
  if (!tok) return { notes: [] };
  return gasCall('GET', { action: 'getNotes', tripId, token: tok });
}
async function apiGetShareInfo(token) { return gasCall('GET', { action: 'getShareInfo', token }); }
async function apiCreateNote(tripId, note) {
  return gasCall('POST', { action: 'createNote', token: currentShareToken(), tripId, note });
}
async function apiUpdateNote(noteId, updates, updatedBy) {
  return gasCall('POST', { action: 'updateNote', token: currentShareToken(), noteId, updates, updatedBy });
}
async function apiDeleteNote(noteId) {
  return gasCall('POST', { action: 'deleteNote', token: currentShareToken(), noteId, requestDevice: getDeviceId() });
}
async function apiUploadImage(tripId, noteId, file, uploadedBy) {
  const [orig, thumb] = await Promise.all([compressImage(file, 1920, 0.85), compressImage(file, 200, 0.80)]);
  return gasCall('POST', { action: 'uploadImage', token: currentShareToken(), tripId, noteId, filename: file.name, originalBase64: orig, thumbnailBase64: thumb, uploadedBy });
}
async function apiDeleteImage(imageId) {
  return gasCall('POST', { action: 'deleteImage', token: currentShareToken(), imageId });
}

// ── Image compression ──────────────────────────────────────────────
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(blobUrl);
      const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = blobUrl;
  });
}

function setNotesFilter(f) { notesFilter = f; renderNotesPage(trips[currentTripIdx]); }

function renderNotesPage(t) {
  const identity = currentIdentity();
  const filtered = notesFilter === 'all' ? currentNotes : currentNotes.filter(n => n.category === notesFilter);

  let notesHtml = '';
  if (filtered.length === 0) {
    notesHtml = `<div class="center-msg" style="padding-top:60px"><div style="margin-bottom:12px;color:#cbd5e1">${_icoNote(32)}</div><div style="color:#94a3b8;font-size:15px">還沒有筆記</div></div>`;
  } else {
    const groups = {};
    for (const n of filtered) { const k = n.date || '__nodate'; (groups[k] = groups[k]||[]).push(n); }
    const keys = Object.keys(groups).sort((a, b) => a==='__nodate'?1:b==='__nodate'?-1:a<b?-1:1);
    for (const key of keys) {
      const labelText = key === '__nodate' ? '無日期關聯' : formatNoteDateLabel(key, t);
      notesHtml += `<div class="notes-date-group"><div class="notes-date-label">${_icoDate(13)} ${esc(labelText)}</div></div>`;
      const grp = [...groups[key]].sort((a, b) => String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
      for (const note of grp) notesHtml += renderNoteCard(note, identity);
    }
  }

  // 篩選列只在第一次渲染，polling 更新時只換筆記列表，避免標籤跳動
  if (!document.querySelector('.notes-filter')) {
    setContent(`<div class="notes-filter">
      <button class="notes-filter-btn${notesFilter==='all'?' active':''}" onclick="setNotesFilter('all')">全部</button>
      <button class="notes-filter-btn${notesFilter==='note'?' active':''}" onclick="setNotesFilter('note')">一般</button>
      <button class="notes-filter-btn${notesFilter==='expense'?' active':''}" onclick="setNotesFilter('expense')">開銷</button>
    </div><div id="notesList"></div>`);
  } else {
    document.querySelectorAll('.notes-filter-btn').forEach((btn, i) => {
      btn.classList.toggle('active', notesFilter === ['all','note','expense'][i]);
    });
  }
  const listEl = document.getElementById('notesList');
  if (listEl) listEl.innerHTML = notesHtml;

  let fab = document.querySelector('.fab');
  if (!fab) {
    fab = document.createElement('button');
    fab.className = 'fab'; fab.textContent = '+';
    document.body.appendChild(fab);
  }
  fab.onclick = () => showNoteForm(t, null);
}

function formatNoteDateLabel(dateStr, t) {
  const d = /^\d{4}-\d{2}-\d{2}$/.test(dateStr) ? new Date(dateStr + 'T00:00:00') : new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const dayNum = Math.round((d - new Date(t.start.getFullYear(), t.start.getMonth(), t.start.getDate())) / 86400000) + 1;
  const days = ['日','一','二','三','四','五','六'];
  return `Day ${dayNum} ｜ ${d.getMonth()+1}/${d.getDate()} 週${days[d.getDay()]}`;
}

function renderNoteCard(note, identity) {
  const canDelete = identity?.isOwner || note.createdByDevice === getDeviceId();
  const icon = note.category === 'expense' ? _icoExpense() : _icoNote();
  const timeStr = noteTimeStr(note.createdAt);
  const isEdited = note.updatedAt && note.updatedAt !== note.createdAt;
  const syncDot = note._syncStatus === 'syncing' ? '<span class="note-sync-dot note-sync-syncing"></span>'
    : note._syncStatus === 'failed' ? '<span class="note-sync-dot note-sync-failed"></span>' : '';

  let imgGrid = '';
  if (note.imageRefs && note.imageRefs.length > 0) {
    const show = note.imageRefs.slice(0, 6); const more = note.imageRefs.length - 6;
    imgGrid = '<div class="note-image-grid">';
    show.forEach((imgId, i) => {
      const key = note.noteId + '_' + imgId;
      const thumbUrl = driveImgUrl((noteImagesCache[key]||{}).thumbnailUrl, 400);
      if (i === 5 && more > 0) {
        imgGrid += `<div class="note-image-more" onclick="showImgPreview('${esc(note.noteId)}',${i})">+${more+1}</div>`;
      } else {
        imgGrid += `<img class="note-image-thumb" src="${esc(thumbUrl)}" loading="lazy" onclick="showImgPreview('${esc(note.noteId)}',${i})">`;
      }
    });
    imgGrid += '</div>';
  }

  let expRow = '';
  if (note.category === 'expense' && note.expenseAmount !== null) {
    expRow = `<div class="note-card-expense">${esc(note.expenseCurrency||'')} ${note.expenseAmount}${note.expensePayer ? '／' + esc(note.expensePayer) : ''}</div>`;
  }

  const metaJson = JSON.stringify({ canDelete }).replace(/"/g, '&quot;');
  return `
    <div class="note-card" id="nc_${esc(note.noteId)}">
      <div class="note-card-top">
        <div class="note-card-icon">${icon}</div>
        <div class="note-card-meta">
          <div class="note-card-author">${esc(note.createdBy)}${syncDot}</div>
          <div class="note-card-time">${esc(timeStr)}${isEdited?' <span style="color:#cbd5e1">（已編輯）</span>':''}</div>
        </div>
        <button class="note-card-menu-btn" onclick="toggleNoteMenu('${esc(note.noteId)}','${metaJson}')">⋯</button>
      </div>
      ${note.text ? `<div class="note-card-text">${esc(note.text)}</div>` : ''}
      ${imgGrid}
      ${expRow}
    </div>`;
}

function noteTimeStr(iso) {
  if (!iso) return '';
  const d = new Date(iso); const now = new Date();
  if (d.toDateString() === now.toDateString()) return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

    formCat = cat; render();
  };
  window.handleImageSelect = async evt => {
    const files = Array.from(evt.target.files);
    const max = 9 - pendingImages.length;
    for (const f of files.slice(0, max)) {
      if (f.size > 20*1024*1024) { alert(f.name + ' 超過 20MB，已略過'); continue; }
      pendingImages.push({ file: f, previewUrl: URL.createObjectURL(f) });
    }
    renderFormPhotos(); evt.target.value = '';
  };
  window.removeFormPhoto = i => { URL.revokeObjectURL(pendingImages[i]?.previewUrl); pendingImages.splice(i,1); renderFormPhotos(); };
  window.changeFormIdentity = () => { const tok = currentShareToken(); if (tok) { localStorage.removeItem('tripIdentity_' + tok); closeNoteForm(); openNotes(); } };

  function renderFormPhotos() {
    const prev = el.querySelector('#formPhotoPrev');
    if (!prev) return;
    prev.innerHTML = pendingImages.map((img, i) => `
      <div class="form-photo-thumb">
        <img src="${img.previewUrl}">
        <button class="form-photo-remove" onclick="removeFormPhoto(${i})">×</button>
      </div>`).join('');
  }

  render();
  document.body.appendChild(el);
}

function closeNoteForm() {
  pendingImages.forEach(img => URL.revokeObjectURL(img.previewUrl));
  pendingImages = [];
  document.getElementById('noteFormOverlay')?.remove();
}

async function submitNoteForm() {
  const el = document.getElementById('noteFormOverlay');
  if (!el) return;
  const text = el.querySelector('#formText')?.value?.trim() || '';
  const noDate = el.querySelector('#formNoDateChk')?.checked;
  const dateVal = noDate ? null : (el.querySelector('#formDateSel')?.value || null);
  const catBtn = el.querySelector('.form-cat-btn.active');
  const cat = catBtn && catBtn.textContent.includes('開銷') ? 'expense' : 'note';
  const amount = el.querySelector('#formAmt')?.value?.trim();
  const currency = el.querySelector('#formCur')?.value || 'TWD';
  const payer = el.querySelector('#formPayer')?.value?.trim() || '';

  if (!text && pendingImages.length === 0) { alert('請輸入內容或加入圖片'); return; }
  if (cat === 'expense' && !amount) { alert('開銷紀錄需填入金額'); return; }

  const identity = currentIdentity();
  const noteData = {
    date: dateVal, category: cat, text,
    imageRefs: [],
    expenseAmount: cat === 'expense' ? parseFloat(amount) : null,
    expenseCurrency: cat === 'expense' ? currency : null,
    expensePayer: cat === 'expense' ? payer : null,
    createdBy: identity?.nickname || '匿名',
    createdByDevice: getDeviceId()
  };

  const imgs = [...pendingImages];
  closeNoteForm();

  if (editingNoteId) {
    await doUpdateNote(editingNoteId, noteData, identity?.nickname);
  } else {
    await doCreateNote(trips[currentTripIdx], noteData, imgs);
  }
}

async function doCreateNote(t, noteData, imgs) {
  const tempId = 'temp_' + Date.now();
  currentNotes.unshift({ ...noteData, noteId: tempId, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), _syncStatus: 'syncing' });
  renderNotesPage(t);
  try {
    const { noteId } = await apiCreateNote(t.name, noteData);
    if (imgs.length > 0) {
      const imageRefs = [];
      for (const img of imgs) {
        try {
          const res = await apiUploadImage(t.name, noteId, img.file, noteData.createdBy);
          imageRefs.push(res.imageId);
          noteImagesCache[noteId + '_' + res.imageId] = { imageUrl: res.imageUrl, thumbnailUrl: res.thumbnailUrl };
          URL.revokeObjectURL(img.previewUrl);
        } catch (_) {}
      }
      if (imageRefs.length > 0) await apiUpdateNote(noteId, { imageRefs }, noteData.createdBy);
      const idx = currentNotes.findIndex(n => n.noteId === tempId);
      if (idx >= 0) currentNotes[idx] = { ...currentNotes[idx], noteId, imageRefs, _syncStatus: 'synced' };
    } else {
      const idx = currentNotes.findIndex(n => n.noteId === tempId);
      if (idx >= 0) currentNotes[idx] = { ...currentNotes[idx], noteId, _syncStatus: 'synced' };
    }
    renderNotesPage(t);
  } catch (e) {
    const idx = currentNotes.findIndex(n => n.noteId === tempId);
    if (idx >= 0) currentNotes[idx]._syncStatus = 'failed';
    renderNotesPage(t); alert('儲存失敗：' + e.message);
  }
}

async function doUpdateNote(noteId, noteData, updatedBy) {
  const t = trips[currentTripIdx];
  const idx = currentNotes.findIndex(n => n.noteId === noteId);
  const prev = idx >= 0 ? { ...currentNotes[idx] } : null;
  if (idx >= 0) currentNotes[idx] = { ...currentNotes[idx], ...noteData, _syncStatus: 'syncing' };
  renderNotesPage(t);
  try {
    await apiUpdateNote(noteId, noteData, updatedBy);
    if (idx >= 0) currentNotes[idx]._syncStatus = 'synced';
    renderNotesPage(t);
  } catch (e) {
    if (idx >= 0 && prev) currentNotes[idx] = prev;
    renderNotesPage(t); alert('更新失敗：' + e.message);
  }
}

// ── Image preview ──────────────────────────────────────────────────
function showImgPreview(noteId, startIdx) {
  const note = currentNotes.find(n => n.noteId === noteId);
  if (!note?.imageRefs?.length) return;
  let idx = startIdx;
  const el = document.createElement('div');
  el.className = 'img-preview-overlay';
  function render() {
    const imgId = note.imageRefs[idx];
    const url = driveImgUrl((noteImagesCache[noteId + '_' + imgId] || {}).imageUrl, 1920);
    el.innerHTML = `
      <button class="img-preview-close" onclick="this.closest('.img-preview-overlay').remove()">×</button>
      <img class="img-preview-img" src="${esc(url)}" alt="">
      <div class="img-preview-counter">${idx+1} / ${note.imageRefs.length}</div>`;
    const img = el.querySelector('img');
    let sx = 0;
    img.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    img.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 40) { idx = dx < 0 ? Math.min(idx+1, note.imageRefs.length-1) : Math.max(idx-1, 0); render(); }
    });
  }
  render();
  document.body.appendChild(el);
}

// ── Polling ────────────────────────────────────────────────────────
function startPolling(tripId) {
  stopPolling();
  window._notesPollingTripId = tripId;
  notesPolling = setInterval(() => syncNotes(tripId), 30000);
  document.addEventListener('visibilitychange', _onVisibilityChange);
}
function stopPolling() {
  if (notesPolling) { clearInterval(notesPolling); notesPolling = null; }
  document.removeEventListener('visibilitychange', _onVisibilityChange);
  window._notesPollingTripId = null;
}
function _onVisibilityChange() {
  const tripId = window._notesPollingTripId;
  if (!tripId) return;
  if (document.hidden) { clearInterval(notesPolling); notesPolling = null; }
  else { notesPolling = setInterval(() => syncNotes(tripId), 30000); syncNotes(tripId); }
}
async function syncNotes(tripId) {
  try {
    const { notes } = await fetchNotes(tripId);
    populateImagesCache(notes);
    const localTemp = currentNotes.filter(n => n._syncStatus === 'syncing' || n._syncStatus === 'failed');
    const localIds = new Set(localTemp.map(n => n.noteId));
    currentNotes = [...notes.filter(n => !localIds.has(n.noteId)), ...localTemp];
    if (trips[currentTripIdx]?.name === tripId) renderNotesPage(trips[currentTripIdx]);
  } catch (_) {}
}

init();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
  // Tell SW the active share token so it can inject into manifest start_url (iOS PWA fix)
  const _swShareId = new URLSearchParams(location.search).get('share');
  const _swStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  navigator.serviceWorker.ready.then(reg => {
    if (!reg.active) return;
    if (_swShareId) {
      reg.active.postMessage({ type: 'SET_SHARE_TOKEN', token: _swShareId });
    } else if (!_swStandalone) {
      reg.active.postMessage({ type: 'CLEAR_SHARE_TOKEN' });
    }
  }).catch(() => {});
}
